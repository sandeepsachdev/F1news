spring.application.name=f1news
server.port=${PORT:8080}

# JPA / Database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 (default, in-memory) — override with DATABASE_URL env var on Render
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:f1newsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=${H2_CONSOLE:true}

# VAPID keys — generate at https://vapidkeys.com/ or set via environment variables
vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:mailto:admin@f1news.app}

# F1 API (Jolpica — community-maintained Ergast successor)
f1.api.base-url=https://api.jolpi.ca/ergast/f1

# Notification check: daily at 09:00 UTC
notification.scheduler.cron=${NOTIFICATION_CRON:0 0 9 * * *}

# WebFlux / WebClient timeouts
spring.webflux.client.connect-timeout=5000

logging.level.com.f1news=INFO
